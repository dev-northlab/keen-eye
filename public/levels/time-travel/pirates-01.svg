  <path d="M278 716l40-10M282 706l36 10" stroke="#6b4226" stroke-width="6" stroke-linecap="round" />
  <g data-anim="fire">
    <path d="M286 706q-4-16 8-26q0 10 6 12q2-10 10-14q-2 14 4 18q2 8-6 10Z" fill="#ff8a1f" />
    <path d="M294 706q-2-8 4-12q2 6 6 6q0 6-4 6Z" fill="#ffd23f" />
  </g>
  <g fill="#3b3b4a">
    <circle cx="180" cy="566" r="7" /><circle cx="194" cy="566" r="7" /><circle cx="187" cy="555" r="7" />
