    <path d="M115 584l1.5-3h9l1.5 3Z" fill="#c3ccd6" />
    <path d="M114 593q3.5-3 7 0t7 0" fill="none" stroke="#fff" stroke-width="2" />
    <path d="M114 602h14l-1 2h-12Z" fill="#c3ccd6" />
