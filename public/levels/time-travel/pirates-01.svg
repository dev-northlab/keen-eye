    <path d="M458 390q-30-14-48 4M458 390q-20-24-46-18M458 390q12-28 42-20M458 390q30-6 42 20M458 390q-2 24-14 34" fill="none" stroke="#3f9a4a" stroke-width="7" stroke-linecap="round" />
    <circle cx="456" cy="398" r="5" fill="#7a4a1d" /><circle cx="464" cy="400" r="5" fill="#7a4a1d" />
  </g>

  <!-- A rowboat pulled up on the sand. -->
