<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750">
  <!-- "Find the odd one out" level pirates-01, the golden age of piracy, upright 500×750. The odd items (groups
       with ids) must stay inside their hitboxes in src/levels/time-travel/pirates-01.json (percent of 500×750) and
       never move. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc4f0" />
      <stop offset="1" stop-color="#e6f7ff" />
    </linearGradient>
  </defs>

  <!-- Sky: sun, clouds, gulls. -->
  <rect width="500" height="250" fill="url(#sky)" />
  <circle cx="70" cy="60" r="40" fill="#fff3b0" opacity="0.6" />
  <g data-anim="sun" fill="#ffd23f">
    <circle cx="70" cy="60" r="28" />
  </g>
  <g data-anim="clouds" fill="#fff">
    <ellipse cx="220" cy="50" rx="38" ry="14" /><circle cx="206" cy="42" r="14" /><circle cx="230" cy="37" r="17" />
    <ellipse cx="460" cy="150" rx="28" ry="11" /><circle cx="450" cy="143" r="11" /><circle cx="468" cy="140" r="13" />
  </g>
  <g data-anim="gulls">
    <path d="M300 130q6-7 12 0q6-7 12 0M326 114q5-6 10 0q5-6 10 0" fill="none" stroke="#5a6b7a" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- The sea and a far island. -->
  <rect y="240" width="500" height="200" fill="#2f97bd" />
  <path d="M0 240h500v14H0Z" fill="#5ab8dc" />
  <path d="M330 246q20-16 44-12q16-10 30 2q-30 10-74 10Z" fill="#6aa86a" />
  <g data-anim="waves">
    <path d="M20 280q14-5 28 0M200 300q14-5 28 0M400 290q14-5 28 0M60 340q14-5 28 0M300 360q14-5 28 0M150 410q14-5 28 0M420 400q14-5 28 0" fill="none" stroke="#bfeaff" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- The pirate ship, rocking. -->
  <g data-anim="ship">
    <path d="M120 300V120M210 300V100" stroke="#5a3a22" stroke-width="6" />
    <path d="M84 126h72q6 26 0 52h-72q-6-26 0-52ZM84 184h72q6 24 0 46h-72q-6-24 0-46Z" fill="#f3ead2" />
    <path d="M170 106h80q6 30 0 60h-80q-6-30 0-60ZM170 172h80q6 28 0 54h-80q-6-28 0-54Z" fill="#f3ead2" />
    <rect x="212" y="74" width="38" height="22" fill="#222" />
    <circle cx="231" cy="83" r="5.5" fill="#fff" />
    <path d="M224 92l15-6M224 86l15 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
    <path d="M290 300l40-28" stroke="#5a3a22" stroke-width="5" stroke-linecap="round" />
    <rect x="40" y="270" width="62" height="30" fill="#7a4e2d" />
    <path d="M32 298h258l-30 44H72Z" fill="#6b4226" />
    <path d="M36 306h250" stroke="#d9a35a" stroke-width="4" />
    <g fill="#3b2a1a">
      <rect x="90" y="314" width="12" height="10" /><rect x="128" y="314" width="12" height="10" />
      <rect x="166" y="314" width="12" height="10" /><rect x="204" y="314" width="12" height="10" /><rect x="242" y="314" width="12" height="10" />
    </g>
    <rect x="52" y="278" width="12" height="12" fill="#ffd23f" />
    <rect x="76" y="278" width="12" height="12" fill="#ffd23f" />
  </g>

  <!-- The beach. -->
  <path d="M0 436q120-14 250-4t250-6V750H0Z" fill="#f2d79a" />
  <path d="M0 440q120-12 250-2t250-6" fill="none" stroke="#fff" stroke-width="5" stroke-opacity="0.7" />
  <g fill="#e2c07e">
    <ellipse cx="200" cy="500" rx="8" ry="3" /><ellipse cx="320" cy="680" rx="9" ry="3" /><ellipse cx="60" cy="660" rx="7" ry="3" />
  </g>

