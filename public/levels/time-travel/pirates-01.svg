    <path d="M124 684h14v17h-14Z" fill="none" stroke="#e8e0d0" stroke-width="2" stroke-dasharray="1.5 1.5" />
    <rect x="127" y="687" width="8" height="11" fill="#222" />
    <circle cx="131" cy="691" r="2.3" fill="#9aa3ab" />
