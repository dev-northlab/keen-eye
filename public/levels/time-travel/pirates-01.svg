  <path d="M374 556v14" stroke="#222" stroke-width="9" />
  <path d="M390 556l2 16" stroke="#c9a364" stroke-width="6" stroke-linecap="round" />
  <path d="M366 526h32l-2 32h-28Z" fill="#6b4a2a" />
  <path d="M362 480h40l2 54h-44Z" fill="#c0392b" />
  <path d="M382 480v54" stroke="#ffd23f" stroke-width="2" stroke-dasharray="4 6" />
  <path d="M361 524h42" stroke="#3b2a1a" stroke-width="5" />
  <path d="M398 488l6-30M366 488l10-30" stroke="#c0392b" stroke-width="7" stroke-linecap="round" />
  <circle cx="382" cy="466" r="14" fill="#d9a070" />
  <path d="M370 470q12 18 24 0v6q-12 14-24 0Z" fill="#222" />
