    <path d="M408 600l-8-6M432 600l8-6M410 606l-6 6M430 606l6 6" stroke="#e5533a" stroke-width="3" stroke-linecap="round" />
    <circle cx="416" cy="595" r="2" fill="#222" /><circle cx="424" cy="595" r="2" fill="#222" />
  </g>
  <path d="M20 730q8-10 16 0Z" fill="#f4b6a6" />
  <path d="M470 740l4-8 4 8-8-5h8Z" fill="#f08a5a" />

  <!-- The treasure map on the sand. -->
  <path d="M60 680h80v28H60Z" fill="#f3e2b3" />
  <path d="M60 680q-6 14 0 28M140 680q6 14 0 28" fill="none" stroke="#d9c08a" stroke-width="5" />
  <path d="M70 702q10-14 22-6t18-8" fill="none" stroke="#8a5a33" stroke-width="1.8" stroke-dasharray="3 3" />
  <path d="M106 686l7 7M113 686l-7 7" stroke="#d93a3a" stroke-width="2.5" stroke-linecap="round" />

