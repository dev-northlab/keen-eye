    <g transform="translate(358 482)">
      <path d="M-2 0q-2 16 -8 24l6-2 2 8 4-12Z" fill="#3a86ff" />
      <ellipse cx="0" cy="-4" rx="7" ry="11" fill="#e63946" />
      <circle cx="1" cy="-16" r="6" fill="#e63946" />
      <path d="M6 -17l5 3-5 3Z" fill="#ffd23f" />
      <circle cx="3" cy="-17" r="1.3" fill="#222" />
    </g>
  </g>

  <!-- The treasure chest. -->
  <path d="M290 596h56l4 18h-64Z" fill="#7a4e2d" />
  <g fill="#ffd23f">
    <circle cx="300" cy="612" r="6" /><circle cx="312" cy="608" r="6" /><circle cx="324" cy="610" r="6" /><circle cx="336" cy="612" r="6" />
    <circle cx="306" cy="602" r="5" /><circle cx="320" cy="600" r="5" /><circle cx="332" cy="603" r="5" />
  </g>
  <circle cx="318" cy="604" r="3.5" fill="#e63946" />
  <rect x="286" y="614" width="64" height="36" rx="3" fill="#8a5a33" />
  <path d="M286 624h64M302 614v36M334 614v36" stroke="#e8a400" stroke-width="3" />
  <rect x="313" y="626" width="10" height="10" rx="2" fill="#e8a400" />

