  <circle cx="242" cy="445" r="1.6" fill="#3b2a1a" /><circle cx="252" cy="445" r="1.6" fill="#3b2a1a" />
  <path d="M241 452q6 4 12 0" fill="none" stroke="#3b2a1a" stroke-width="1.5" />

