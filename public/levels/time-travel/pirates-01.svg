  <path d="M60 508q-4 20 0 40h40q4-20 0-40Z" fill="#9a6b3c" />
  <path d="M58 518h44M58 538h44" stroke="#5a3a22" stroke-width="3" />
  <path d="M68 506l30 4v30" fill="none" stroke="#6b4a2a" stroke-width="10" stroke-linejoin="round" />
  <path d="M96 542h10" stroke="#222" stroke-width="6" stroke-linecap="round" />
  <path d="M64 466h28l2 42h-32Z" fill="#4f8f3a" />
  <path d="M88 474l12 12" stroke="#d9a070" stroke-width="6" stroke-linecap="round" />
  <circle cx="78" cy="452" r="12" fill="#d9a070" />
  <path d="M66 448q12-16 24 0Z" fill="#3a6fd8" />
  <path d="M66 448l-8 6" stroke="#3a6fd8" stroke-width="3" stroke-linecap="round" />
  <path d="M74 460q4 3 8 0" stroke="#3b2a1a" stroke-width="1.5" fill="none" />

  <!-- The pirate in a striped shirt (still: he holds the revolver, wears the boots). -->
  <path d="M236 548v-12M262 548v-12" stroke="#2b2b2b" stroke-width="7" />
  <path d="M230 458h34l2 52h-38Z" fill="#fafafa" />
  <path d="M230 468h34M229 480h36M229 492h37M228 504h38" stroke="#d93a3a" stroke-width="5" />
  <path d="M230 510h36l-2 28h-32Z" fill="#3b3b4a" />
  <path d="M262 468l20-10" stroke="#d9a070" stroke-width="6" stroke-linecap="round" />
