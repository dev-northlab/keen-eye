    <rect x="384" y="452" width="13" height="16" rx="5" fill="#3b3b4a" />
    <rect x="379" y="456" width="6" height="8" fill="#2b2b2b" />
    <circle cx="374" cy="468" r="5.5" fill="#222" />
    <circle cx="390" cy="468" r="5.5" fill="#222" />
    <circle cx="374" cy="468" r="3.8" fill="#6ec6ff" />
    <circle cx="390" cy="468" r="3.8" fill="#6ec6ff" />
