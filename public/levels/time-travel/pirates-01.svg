    <ellipse cx="380" cy="76" rx="26" ry="30" fill="#ff7a00" />
    <path d="M380 46q-12 30 0 60q12-30 0-60Z" fill="#ffd23f" />
    <path d="M358 68h44" stroke="#3a86ff" stroke-width="5" />
    <rect x="373" y="118" width="14" height="10" rx="2" fill="#8a5a33" />
  </g>
  <g id="steamship">
    <path d="M394 254h70l-7 12h-56Z" fill="#333" />
    <rect x="406" y="244" width="40" height="10" fill="#fafafa" />
    <path d="M410 249h5M420 249h5M430 249h5" stroke="#3a86ff" stroke-width="3" />
    <rect x="428" y="226" width="10" height="20" fill="#d93a3a" />
    <rect x="428" y="226" width="10" height="4" fill="#222" />
    <g fill="#c3ccd6"><circle cx="442" cy="220" r="4" /><circle cx="450" cy="216" r="5" /><circle cx="460" cy="214" r="5" /></g>
  </g>
