      <ellipse cx="278" cy="280" rx="16" ry="10" /><circle cx="294" cy="273" r="7" />
      <path d="M299 275q7 4 5 14" stroke="#7a4e2d" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M313 290v8M319 290v8M327 290v8M333 290v8" stroke="#5a3a22" stroke-width="3" />
      <ellipse cx="323" cy="285" rx="12" ry="8" /><circle cx="336" cy="280" r="5" />
      <path d="M340 282q5 3 3 10" stroke="#7a4e2d" stroke-width="2.6" fill="none" stroke-linecap="round" />
