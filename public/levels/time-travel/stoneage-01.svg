  <circle cx="420" cy="60" r="42" fill="#fff3b0" opacity="0.6" />
  <g data-anim="sun" fill="#ffd23f">
    <circle cx="420" cy="60" r="30" />
  </g>
  <g data-anim="clouds" fill="#fff">
    <ellipse cx="300" cy="64" rx="38" ry="14" /><circle cx="286" cy="56" r="14" /><circle cx="310" cy="50" r="17" />
    <ellipse cx="360" cy="140" rx="28" ry="11" /><circle cx="350" cy="133" r="11" /><circle cx="368" cy="130" r="13" />
  </g>
  <g data-anim="birds">
