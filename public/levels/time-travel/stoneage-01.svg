<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- "Find the odd one out" level stoneage-01, the Stone Age. The odd items (groups with ids) must stay
       inside their hitboxes in src/levels/time-travel/stoneage-01.json (percent of 800×500). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad7f0" />
      <stop offset="1" stop-color="#f2f0d0" />
