<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750">
  <!-- "Find the odd one out" level wildwest-01, the Wild West, upright 500×750. The odd items (groups with ids)
       must stay inside their hitboxes in src/levels/time-travel/wildwest-01.json (percent of 500×750) and never
       move. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ec" />
      <stop offset="1" stop-color="#ffe6b8" />
