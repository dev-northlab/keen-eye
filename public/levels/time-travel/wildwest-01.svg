  <path d="M548 436h10M564 436h10" stroke="#fff" stroke-width="4" stroke-linecap="round" />
  <path d="M546 386h28v30h-28Z" fill="#4f8f3a" />
  <path d="M546 390l-8 18M574 390l8 18" stroke="#e8c09a" stroke-width="5" stroke-linecap="round" />
  <circle cx="560" cy="372" r="12" fill="#e8c09a" />
  <path d="M549 368q11-14 22 0q-4-6-11-6t-11 6Z" fill="#8a5a33" />
  <circle cx="564" cy="372" r="1.5" fill="#3b2a1a" />

  <!-- Dog jumping for the flying disc. -->
  <g data-anim="dog">
    <path d="M676 428l-6 14M684 430l-2 14M700 428l4 14M708 426l6 12" stroke="#a8743f" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="692" cy="420" rx="22" ry="12" fill="#c9954f" />
    <path d="M670 416q-10-6-12-16" stroke="#c9954f" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="712" cy="404" r="10" fill="#c9954f" />
    <path d="M704 398l-4-10 8 4Z" fill="#a8743f" />
    <ellipse cx="721" cy="407" rx="5" ry="3.5" fill="#c9954f" />
    <circle cx="724" cy="406" r="1.6" fill="#222" />
    <circle cx="714" cy="402" r="1.5" fill="#222" />
  </g>

  <!-- Odd items. -->
  <g id="dish">
    <path d="M500 242v-6" stroke="#6b4a2a" stroke-width="3" />
    <ellipse cx="500" cy="229" rx="11" ry="10" fill="#e1e6ec" stroke="#9aa3ab" stroke-width="1.5" transform="rotate(-20 500 229)" />
    <ellipse cx="499" cy="230" rx="6.5" ry="5.5" fill="#c3ccd6" transform="rotate(-20 499 230)" />
    <path d="M497 238l10-12" stroke="#5a6470" stroke-width="1.8" stroke-linecap="round" />
    <rect x="505" y="222" width="5" height="5" rx="1" fill="#3b3b4a" />
  </g>
  <g id="neon">
    <rect x="194" y="176" width="54" height="44" rx="5" fill="#2b2b3a" />
    <g data-anim="neon-flicker">
      <path d="M210 182l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="none" stroke="#ff4fa3" stroke-width="5" stroke-opacity="0.35" stroke-linejoin="round" />
      <path d="M210 182l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="none" stroke="#ff8cc6" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M240 186q2 20-20 28M220 214l2-7M220 214l7 1" fill="none" stroke="#4fe0ff" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" />
      <path d="M240 186q2 20-20 28M220 214l2-7M220 214l7 1" fill="none" stroke="#a6f0ff" stroke-width="1.8" stroke-linecap="round" />
    </g>
