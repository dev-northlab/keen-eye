  <path d="M184 400v-46M178 360h12" stroke="#6b4226" stroke-width="5" stroke-linecap="round" />
  <g data-anim="horse-tail">
    <path d="M76 390q-14 10-10 34q8-8 14-26Z" fill="#3b2a1a" />
  </g>
  <path d="M90 410v40M104 410v40M132 410v40M146 410v40" stroke="#7a4e2d" stroke-width="7" stroke-linecap="round" />
