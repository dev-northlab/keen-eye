    <path d="M544 443v3M580 443v3" stroke="#7b8794" stroke-width="3" />
    <circle cx="544" cy="449" r="4" fill="#ffd23f" />
    <circle cx="580" cy="449" r="4" fill="#ffd23f" />
  </g>
  <g id="frisbee">
