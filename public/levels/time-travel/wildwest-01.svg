  <path d="M150 392q10-22 14-34" stroke="#8a5a33" stroke-width="16" stroke-linecap="round" />
  <path d="M158 356q14-8 24 4q-2 8-12 8Z" fill="#8a5a33" />
  <path d="M152 380q6-16 10-28" stroke="#3b2a1a" stroke-width="5" stroke-linecap="round" />
