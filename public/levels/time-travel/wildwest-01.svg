  <path d="M316 386l-6 22M344 386l6 20" stroke="#d9a070" stroke-width="6" stroke-linecap="round" />
  <circle cx="330" cy="368" r="14" fill="#d9a070" />
  <path d="M322 374q8 4 16 0" stroke="#5a3a22" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M308 356h44" stroke="#7a4e2d" stroke-width="5" stroke-linecap="round" />
  <path d="M318 356q0-14 12-14t12 14Z" fill="#7a4e2d" />

  <!-- Cowboy with a lasso. -->
  <path d="M442 452h-6M458 452h6" stroke="#5a3a22" stroke-width="7" stroke-linecap="round" />
  <path d="M440 416h9v36h-9ZM451 416h9v36h-9Z" fill="#3a5f9e" />
  <path d="M436 382h28v36h-28Z" fill="#d93a3a" />
  <path d="M436 392h28M436 404h28M445 382v36M455 382v36" stroke="#a82a2a" stroke-width="2" />
  <path d="M434 414h32" stroke="#5a3a22" stroke-width="5" />
  <circle cx="430" cy="420" r="9" fill="none" stroke="#c9a364" stroke-width="3" />
  <path d="M436 386l-8 24M464 386l6 22" stroke="#e0a878" stroke-width="6" stroke-linecap="round" />
  <circle cx="450" cy="368" r="14" fill="#e0a878" />
  <circle cx="455" cy="365" r="1.6" fill="#3b2a1a" />
  <path d="M428 356h44" stroke="#c9954f" stroke-width="5" stroke-linecap="round" />
  <path d="M438 356q0-14 12-14t12 14Z" fill="#c9954f" />

