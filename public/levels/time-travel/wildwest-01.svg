  <!-- Sheriff. -->
  <path d="M322 446h-6M338 446h6" stroke="#5a3a22" stroke-width="7" stroke-linecap="round" />
  <path d="M320 412h9v34h-9ZM331 412h9v34h-9Z" fill="#3a5f9e" />
  <path d="M316 382h28v32h-28Z" fill="#e8d3a8" />
