<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- "Find the odd one out" level wildwest-01, the Wild West. The odd items (groups with ids) must stay
       inside their hitboxes in src/levels/time-travel/wildwest-01.json (percent of 800×500). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f5" />
      <stop offset="1" stop-color="#ffe4b0" />
    </linearGradient>
  </defs>

  <!-- Sky. -->
  <rect width="800" height="300" fill="url(#sky)" />
  <circle cx="90" cy="70" r="48" fill="#fff3b0" opacity="0.6" />
  <g data-anim="sun" fill="#ffd23f">
    <circle cx="90" cy="70" r="36" />
  </g>
  <g data-anim="hawk">
    <path d="M300 150q10-10 20-2q10-8 20 2q-10-4-20 2q-10-6-20-2Z" fill="#5a3a22" />
  </g>

  <!-- Mesas. -->
  <path d="M300 300V232l20-10h80l20 10v68Z" fill="#d98a4a" />
  <path d="M380 222h20l20 10v68h-40Z" fill="#c07338" />
  <path d="M520 300V212l16-8h110l14 8v88Z" fill="#d98a4a" />
  <path d="M620 204h26l14 8v88h-40Z" fill="#c07338" />

  <!-- Ground, railway and telegraph line. -->
  <rect y="290" width="800" height="210" fill="#e8c38a" />
  <path d="M280 296H800" stroke="#6b4a2a" stroke-width="3" />
  <path d="M290 299h10M320 299h10M350 299h10M380 299h10M410 299h10M440 299h10M470 299h10M500 299h10M530 299h10M560 299h10M590 299h10M620 299h10M650 299h10M680 299h10M710 299h10M740 299h10M770 299h10" stroke="#6b4a2a" stroke-width="3" />
  <path d="M330 296V240M500 296V240M330 246h-8M330 246h8M500 246h-8M500 246h8M322 244q89 14 186 0" fill="none" stroke="#6b4a2a" stroke-width="2.5" />
  <path d="M0 360q200-12 400 0t400 0" fill="none" stroke="#d9ae6c" stroke-width="40" stroke-opacity="0.5" />
  <ellipse cx="420" cy="480" rx="9" ry="4" fill="#c99a5a" />
  <ellipse cx="640" cy="470" rx="7" ry="3" fill="#c99a5a" />

  <!-- Steam train. -->
  <g data-anim="train">
    <!-- Drawn facing left; turned to face right, the direction "flipX" expects. -->
    <g transform="matrix(-1 0 0 1 1322 0)">
    <rect x="600" y="270" width="44" height="22" rx="3" fill="#2b2b2b" />
    <rect x="628" y="258" width="16" height="14" fill="#2b2b2b" />
    <rect x="606" y="256" width="8" height="14" fill="#2b2b2b" />
    <path d="M600 288l-10 4h10Z" fill="#d93a3a" />
    <rect x="631" y="261" width="10" height="7" fill="#ffd23f" />
    <circle cx="610" cy="248" r="5" fill="#e1e6ec" /><circle cx="620" cy="242" r="6" fill="#e1e6ec" />
    <rect x="648" y="272" width="40" height="18" rx="2" fill="#a8743f" />
    <rect x="692" y="272" width="40" height="18" rx="2" fill="#8a5a33" />
    <g fill="#222"><circle cx="608" cy="292" r="4" /><circle cx="622" cy="292" r="4" /><circle cx="636" cy="292" r="4" />
      <circle cx="656" cy="292" r="3.5" /><circle cx="680" cy="292" r="3.5" /><circle cx="700" cy="292" r="3.5" /><circle cx="724" cy="292" r="3.5" /></g>
    </g>
  </g>

