    <path d="M332 364h10q3 0 2 3l-1 4q-1 3-4 3h-3q-3 0-4-3l-1-4q-1-3 1-3Z" fill="#222" />
    <path d="M328 366h4M318 365l-1 1M342 365l1 1" stroke="#222" stroke-width="1.5" />
    <path d="M320 366l3 3M334 366l3 3" stroke="#6ec6ff" stroke-width="1.2" />
  </g>
  <g id="gum">
    <circle cx="466" cy="374" r="11" fill="#ff8fc8" stroke="#e8609f" stroke-width="1.5" />
    <ellipse cx="462" cy="369" rx="3" ry="2" fill="#fff" fill-opacity="0.7" />
  </g>
  <g id="headphones">
    <path d="M547 372q13-24 26 0" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" />
    <rect x="542" y="366" width="8" height="14" rx="3" fill="#d93a3a" />
    <rect x="570" y="366" width="8" height="14" rx="3" fill="#d93a3a" />
  </g>
  <g id="skateboard">
