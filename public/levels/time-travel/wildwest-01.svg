  <rect x="30" y="170" width="230" height="160" fill="#b5793f" />
  <path d="M30 196h230M30 222h230M30 248h230M30 274h230M30 300h230" stroke="#9a6534" stroke-width="2" />
  <rect x="70" y="148" width="100" height="24" rx="3" fill="#7a4e2d" />
  <path d="M110 166v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" />
  <rect x="48" y="230" width="44" height="40" fill="#ffe7a3" stroke="#6b4226" stroke-width="4" />
  <rect x="198" y="230" width="44" height="40" fill="#ffe7a3" stroke="#6b4226" stroke-width="4" />
  <rect x="120" y="250" width="50" height="80" fill="#5a3a22" />
  <path d="M123 268h21v40h-21ZM146 268h21v40h-21Z" fill="#c9954f" />
  <path d="M20 232L270 220v12L20 244Z" fill="#7a4e2d" />
  <rect x="26" y="240" width="7" height="90" fill="#6b4226" />
  <rect x="254" y="232" width="7" height="98" fill="#6b4226" />
  <path d="M272 304q-4 18 0 36h28q4-18 0-36Z" fill="#9a6b3c" />
  <path d="M271 316h30M271 330h30" stroke="#5a3a22" stroke-width="2.5" />

