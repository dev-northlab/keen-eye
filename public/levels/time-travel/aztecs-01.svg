<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- "Find the odd one out" level aztecs-01, the Aztecs. The odd items (groups with ids) must stay
       inside their hitboxes in src/levels/time-travel/aztecs-01.json (percent of 800×500). -->
  <defs>
