# Codemagic: builds the iOS app in the cloud and uploads it to TestFlight (spec, section 2 — no Mac needed).
#
# One-time setup, when the game is ready for testers:
#   1. Apple Developer Program account; in App Store Connect create the app with bundle id com.keeneye.app.
#   2. App Store Connect → Users and Access → Integrations: create an API key (App Manager role).
#   3. Codemagic: add this repository; Team settings → Integrations → App Store Connect: add the key
#      under the name "keen_eye_asc". Codemagic then creates the signing certificate and profile itself.
#   4. Start the "iOS → TestFlight" workflow manually (no automatic triggers are configured).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: keen_eye_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.keeneye.app
      node: 24
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Validate levels
        script: npm run check-levels
      - name: Build the web app and copy it into the iOS project
        script: npm run build && npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build number
        # Codemagic's build counter keeps every TestFlight upload unique; the version (1.0) is in Xcode.
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build the .ipa
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
